<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prontuário Eletrônico — Hospital dos Estagiários da Tuiuti</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #f0f2f5; color: #1a1a1a; min-height: 100vh; }

    .header {
      background: linear-gradient(90deg, #0d47a1 0%, #1565c0 100%);
      color: white; padding: 12px 20px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15); flex-wrap: wrap; gap: 10px;
    }
    .header-brand { display: flex; align-items: center; gap: 12px; }
    .header-logo {
      width: 36px; height: 36px; background: white; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: #0d47a1; font-weight: 800; font-size: 18px;
    }
    .header-title { font-size: 16px; font-weight: 700; letter-spacing: 0.3px; }
    .header-subtitle { font-size: 11px; opacity: 0.85; font-weight: 500; }
    .header-info { display: flex; align-items: center; gap: 16px; font-size: 12px; }
    .header-badge { background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 12px; }

    .patient-bar {
      background: white; border-bottom: 1px solid #d0d7de;
      padding: 14px 20px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    }
    .patient-avatar {
      width: 48px; height: 48px; background: #e3f2fd; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 22px;
    }
    .patient-name { font-size: 15px; font-weight: 700; color: #0d47a1; }
    .patient-name span { font-size: 11px; color: #666; font-weight: 500; }
    .patient-meta { font-size: 12px; color: #555; margin-top: 2px; }
    .badges { display: flex; gap: 8px; flex-wrap: wrap; }
    .badge {
      padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; border: 1px solid;
    }
    .badge-red { background: #ffebee; color: #c62828; border-color: #ef9a9a; }
    .badge-orange { background: #fff3e0; color: #e65100; border-color: #ffcc80; }
    .badge-pink { background: #fce4ec; color: #ad1457; border-color: #f48fb1; }
    .badge-purple { background: #f3e5f5; color: #6a1b9a; border-color: #ce93d8; }
    .badge-green { background: #e8f5e9; color: #2e7d32; border-color: #a5d6a7; }
    .badge-cyan { background: #e0f7fa; color: #006064; border-color: #80deea; }
    .badge-yellow { background: #fff8e1; color: #f57f17; border-color: #ffe082; }
    .badge-blue { background: #e3f2fd; color: #0d47a1; border-color: #90caf9; }
    .badge-gray { background: #f5f5f5; color: #555; border-color: #bdbdbd; }

    .layout { display: flex; min-height: calc(100vh - 140px); }
    .sidebar {
      width: 240px; background: white; border-right: 1px solid #d0d7de;
      padding: 16px 0; flex-shrink: 0;
    }
    .sidebar-label {
      padding: 0 16px 8px; font-size: 10px; font-weight: 700;
      color: #888; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .nav-btn {
      width: 100%; text-align: left; padding: 10px 20px; border: none;
      background: transparent; color: #444; font-size: 13px; cursor: pointer;
      border-left: 3px solid transparent; display: flex; align-items: center; gap: 8px;
      transition: all 0.15s;
    }
    .nav-btn:hover { background: #f5f5f5; }
    .nav-btn.active {
      background: #e3f2fd; color: #0d47a1; font-weight: 600;
      border-left: 3px solid #0d47a1;
    }
    .nav-btn.add-btn { color: #2e7d32; font-weight: 600; }
    .nav-btn.add-btn.active {
      background: #e8f5e9; color: #2e7d32; border-left: 3px solid #2e7d32;
    }

    .content { flex: 1; padding: 20px; overflow-y: auto; }
    .panel {
      background: white; border-radius: 10px; border: 1px solid #d0d7de;
      padding: 20px; margin-bottom: 16px;
    }
    .panel-title {
      margin: 0 0 16px 0; font-size: 18px; color: #0d47a1;
      border-bottom: 2px solid #e3f2fd; padding-bottom: 8px;
    }
    .panel-title-green {
      margin: 0 0 16px 0; font-size: 18px; color: #2e7d32;
      border-bottom: 2px solid #c8e6c9; padding-bottom: 8px;
    }

    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
    .grid-problems { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
    .card {
      background: #fafafa; border-radius: 8px; padding: 14px;
      border-left: 4px solid #0d47a1;
    }
    .card-title { font-size: 11px; color: #888; text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
    .card-body { font-size: 14px; color: #333; }
    .card-body-sm { font-size: 13px; color: #333; line-height: 1.7; }
    .card-sub { font-size: 12px; color: #555; margin-top: 4px; }
    .card-blue { border-left-color: #0d47a1; }
    .card-red { border-left-color: #c62828; }
    .card-orange { border-left-color: #e65100; }
    .card-green { border-left-color: #2e7d32; }
    .card-purple { border-left-color: #6a1b9a; }
    .card-cyan { border-left-color: #006064; }
    .card-yellow { border-left-color: #f9a825; }
    .card-gray { border-left-color: #888; }

    .metric-card { border-radius: 10px; padding: 20px; text-align: center; }
    .metric-blue { background: linear-gradient(135deg, #e3f2fd, #bbdefb); }
    .metric-green { background: linear-gradient(135deg, #e8f5e9, #c8e6c9); }
    .metric-red { background: linear-gradient(135deg, #ffebee, #ffcdd2); }
    .metric-orange { background: linear-gradient(135deg, #fff3e0, #ffe0b2); }
    .metric-value { font-size: 32px; font-weight: 800; }
    .metric-blue .metric-value { color: #0d47a1; }
    .metric-green .metric-value { color: #2e7d32; }
    .metric-red .metric-value { color: #c62828; }
    .metric-orange .metric-value { color: #e65100; }
    .metric-unit { font-size: 16px; }
    .metric-label { font-size: 12px; color: #555; margin-top: 4px; font-weight: 600; }
    .metric-alert { font-size: 11px; font-weight: 700; margin-top: 2px; }

    .alert-box { background: #fff8e1; border-radius: 8px; padding: 14px; border: 1px solid #ffe082; }
    .alert-box p { font-size: 13px; color: #5d4037; line-height: 1.6; }

    .timeline-item {
      border-left: 3px solid #0d47a1; padding-left: 20px;
      margin-bottom: 20px; position: relative;
    }
    .timeline-dot {
      position: absolute; left: -9px; top: 0;
      width: 16px; height: 16px; border-radius: 50%;
      border: 3px solid white; box-shadow: 0 0 0 1px;
    }
    .timeline-badge {
      display: inline-block; padding: 4px 12px; border-radius: 12px;
      font-size: 12px; font-weight: 700; margin-bottom: 8px;
    }
    .timeline-text { font-size: 13px; line-height: 1.7; color: #333; }

    .problem-item { padding: 10px 14px; border-radius: 8px; font-size: 13px; border-left: 3px solid; }

    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 12px; font-weight: 600; color: #555; display: block; margin-bottom: 4px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 10px 12px; border: 1px solid #ccc;
      border-radius: 6px; font-size: 13px; font-family: inherit;
    }
    .form-textarea { min-height: 120px; resize: vertical; }
    .form-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .btn-primary {
      background: #2e7d32; color: white; border: none;
      padding: 12px 24px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .btn-primary:hover { background: #1b5e20; }
    .hint-box { background: #e8f5e9; border-radius: 8px; padding: 14px; margin-bottom: 16px; font-size: 13px; color: #2e7d32; }
    .loading { text-align: center; padding: 40px; color: #888; font-size: 14px; }
    .error { text-align: center; padding: 40px; color: #c62828; font-size: 14px; background: #ffebee; border-radius: 8px; }

    @media (max-width: 768px) {
      .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #d0d7de; }
      .layout { flex-direction: column; }
      .patient-bar { flex-direction: column; align-items: flex-start; }
      .form-grid-3 { grid-template-columns: 1fr; }
    }
    .hidden { display: none !important; }
    ul { margin: 6px 0; padding-left: 20px; }
    li { margin-bottom: 4px; }
    p { margin-bottom: 8px; }
    b { font-weight: 700; }
  </style>
<base target="_blank">
</head>
<body>

  <div class="header">
    <div class="header-brand">
      <div class="header-logo">T</div>
      <div>
        <div class="header-title">HOSPITAL DOS ESTAGIÁRIOS DA TUIUTI</div>
        <div class="header-subtitle">Prontuário Eletrônico do Paciente — v3.2</div>
      </div>
    </div>
    <div class="header-info">
      <span>👤 Dr. Silva</span>
      <span id="clock">🕐 --/--/---- --:--</span>
      <span class="header-badge">UTI</span>
    </div>
  </div>

  <div class="patient-bar" id="patient-bar">
    <div class="loading">Carregando dados do paciente...</div>
  </div>

  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-label">Navegação</div>
      <button class="nav-btn active" onclick="showTab('resumo')" id="btn-resumo">📋 Resumo Clínico</button>
      <button class="nav-btn" onclick="showTab('dados')" id="btn-dados">📊 Dados Antropométricos</button>
      <button class="nav-btn" onclick="showTab('historia')" id="btn-historia">🏠 História Social</button>
      <button class="nav-btn" onclick="showTab('antecedentes')" id="btn-antecedentes">📁 Antecedentes</button>
      <button class="nav-btn" onclick="showTab('evento')" id="btn-evento">🚨 Evento Atual</button>
      <button class="nav-btn" onclick="showTab('evolucao')" id="btn-evolucao">📈 Evolução Médica</button>
      <button class="nav-btn" onclick="showTab('fisio')" id="btn-fisio">🦵 Fisioterapia</button>
      <button class="nav-btn" onclick="showTab('enfermagem')" id="btn-enfermagem">🩺 Enfermagem</button>
      <button class="nav-btn" onclick="showTab('problemas')" id="btn-problemas">⚠️ Problemas Ativos</button>
      <button class="nav-btn add-btn" onclick="showTab('adicionar')" id="btn-adicionar">➕ Adicionar Evolução</button>
    </div>

    <div class="content" id="content-area">
      <div class="loading">Carregando prontuário...</div>
    </div>
  </div>

  <script>
    let DADOS = null;

    const CORES = {
      blue:   { bg: '#e3f2fd',   text: '#0d47a1', border: '#90caf9', dot: '#0d47a1' },
      red:    { bg: '#ffebee',   text: '#c62828', border: '#ef9a9a', dot: '#c62828' },
      orange: { bg: '#fff3e0',   text: '#e65100', border: '#ffcc80', dot: '#e65100' },
      yellow: { bg: '#fff8e1',   text: '#f57f17', border: '#ffe082', dot: '#f9a825' },
      green:  { bg: '#e8f5e9',   text: '#2e7d32', border: '#a5d6a7', dot: '#2e7d32' },
      purple: { bg: '#f3e5f5',   text: '#6a1b9a', border: '#ce93d8', dot: '#6a1b9a' },
      cyan:   { bg: '#e0f7fa',   text: '#006064', border: '#80deea', dot: '#006064' },
      gray:   { bg: '#f5f5f5',   text: '#555',    border: '#bdbdbd', dot: '#888' },
      pink:   { bg: '#fce4ec',   text: '#ad1457', border: '#f48fb1', dot: '#ad1457' }
    };

    const BADGE_CLASSES = {
      red: 'badge-red', orange: 'badge-orange', pink: 'badge-pink',
      purple: 'badge-purple', green: 'badge-green', cyan: 'badge-cyan',
      yellow: 'badge-yellow', blue: 'badge-blue', gray: 'badge-gray'
    };

    const CARD_CLASSES = {
      blue: 'card-blue', red: 'card-red', orange: 'card-orange',
      green: 'card-green', purple: 'card-purple', cyan: 'card-cyan',
      yellow: 'card-yellow', gray: 'card-gray'
    };

    function updateClock() {
      const now = new Date();
      const pad = n => n.toString().padStart(2, '0');
      document.getElementById('clock').textContent = `🕐 ${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function carregarDados() {
      try {
        const response = await fetch('./dados.json');
        if (!response.ok) throw new Error("Não foi possível carregar dados.json");
        DADOS = await response.json();
        renderizarTudo();
      } catch (e) {
        document.getElementById('patient-bar').innerHTML = `<div class="error">❌ Erro ao carregar dados.json: ${e.message}<br><small>Verifique se o arquivo dados.json está na mesma pasta do index.html</small></div>`;
        document.getElementById('content-area').innerHTML = '';
      }
    }

    function renderizarTudo() {
      renderizarBarraPaciente();
      renderizarConteudo();
    }

    function renderizarBarraPaciente() {
      const p = DADOS.paciente;
      const badgesHtml = DADOS.badges.map(b => `<span class="badge ${BADGE_CLASSES[b.cor] || 'badge-blue'}">${b.icone || ''} ${b.texto}</span>`).join('');
      document.getElementById('patient-bar').innerHTML = `
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="patient-avatar">👴</div>
          <div>
            <div class="patient-name">${p.nome.toUpperCase()} <span>(${p.idade} anos, ${p.sexo})</span></div>
            <div class="patient-meta">Prontuário: <b>${p.prontuario}</b> | Internação: <b>${p.data_internacao}</b></div>
          </div>
        </div>
        <div class="badges">${badgesHtml}</div>
      `;
    }

    function renderizarConteudo() {
      const area = document.getElementById('content-area');
      area.innerHTML = `
        <div id="tab-resumo">${renderResumo()}</div>
        <div id="tab-dados" class="hidden">${renderDados()}</div>
        <div id="tab-historia" class="hidden">${renderHistoria()}</div>
        <div id="tab-antecedentes" class="hidden">${renderAntecedentes()}</div>
        <div id="tab-evento" class="hidden">${renderEvento()}</div>
        <div id="tab-evolucao" class="hidden">${renderEvolucao('medica', 'Evolução Médica')}</div>
        <div id="tab-fisio" class="hidden">${renderEvolucao('fisio', 'Evolução Fisioterapêutica')}</div>
        <div id="tab-enfermagem" class="hidden">${renderEvolucao('enfermagem', 'Evolução de Enfermagem')}</div>
        <div id="tab-problemas" class="hidden">${renderProblemas()}</div>
        <div id="tab-adicionar" class="hidden">${renderAdicionar()}</div>
      `;
    }

    function renderResumo() {
      const r = DADOS.resumo;
      return `
        <div class="panel">
          <h2 class="panel-title">📋 Resumo Clínico do Paciente</h2>
          <div class="grid-2">
            <div class="card card-blue"><div class="card-title">Identificação</div><div class="card-body">${r.identificacao}</div></div>
            <div class="card card-red"><div class="card-title">Motivo de Internação</div><div class="card-body">${r.motivo_internacao}</div></div>
            <div class="card card-orange"><div class="card-title">Status Atual</div><div class="card-body">${r.status_atual}</div></div>
            <div class="card card-green"><div class="card-title">Comorbidades Principais</div><div class="card-body-sm">${r.comorbidades}</div></div>
            <div class="card card-purple"><div class="card-title">Aspectos Psicossociais</div><div class="card-body-sm">${r.psicossociais}</div></div>
            <div class="card card-cyan"><div class="card-title">Suporte Ventilatório</div><div class="card-body">${r.ventilacao}</div></div>
          </div>
        </div>`;
    }

    function renderDados() {
      const p = DADOS.paciente;
      return `
        <div class="panel">
          <h2 class="panel-title">📊 Dados Antropométricos</h2>
          <div class="grid-4" style="margin-bottom:20px;">
            <div class="metric-card metric-blue"><div class="metric-value">${p.peso_atual_kg} <span class="metric-unit">kg</span></div><div class="metric-label">PESO ATUAL</div></div>
            <div class="metric-card metric-green"><div class="metric-value">${p.estatura_m.toString().replace('.', ',')} <span class="metric-unit">m</span></div><div class="metric-label">ESTATURA</div></div>
            <div class="metric-card metric-red"><div class="metric-value">${p.imc.toString().replace('.', ',')}</div><div class="metric-label">IMC kg/m²</div><div class="metric-alert" style="color:#c62828;">OBESIDADE GRAVE</div></div>
            <div class="metric-card metric-orange"><div class="metric-value">${p.peso_habitual_kg} <span class="metric-unit">kg</span></div><div class="metric-label">PESO HABITUAL</div></div>
          </div>
          <div class="alert-box"><p><b>⚠️ Variação ponderal:</b> ${p.variacao_ponderal}</p></div>
        </div>`;
    }

    function renderHistoria() {
      const cards = DADOS.historia_social.map(h => {
        const cls = CARD_CLASSES[h.cor] || 'card-blue';
        return `<div class="card ${cls}"><div style="font-weight:700;color:${CORES[h.cor]?.text||'#0d47a1'};margin-bottom:6px;">${h.icone} ${h.titulo}</div><div class="card-body-sm">${h.texto}</div></div>`;
      }).join('');
      return `<div class="panel"><h2 class="panel-title">🏠 História Social e Familiar</h2><div style="display:flex;flex-direction:column;gap:14px;">${cards}</div></div>`;
    }

    function renderAntecedentes() {
      const items = DADOS.antecedentes.map(a => `
        <div style="margin-bottom:20px;">
          <div style="background:${a.cor_header};padding:10px 14px;border-radius:8px 8px 0 0;font-weight:700;color:${a.cor_texto};font-size:14px;">${a.icone} ${a.titulo}</div>
          <div style="background:#fafafa;padding:14px;border-radius:0 0 8px 8px;border:1px solid ${a.cor_borda};border-top:none;font-size:13px;line-height:1.7;color:#333;">${a.texto}</div>
        </div>
      `).join('');
      return `<div class="panel"><h2 class="panel-title">📁 Antecedentes Pessoais</h2>${items}</div>`;
    }

    function renderEvento() {
      const e = DADOS.evento_atual;
      const lista = e.evoluiu_com.map(item => `<li>${item}</li>`).join('');
      return `
        <div class="panel">
          <h2 class="panel-title">🚨 História do Evento Atual</h2>
          <div style="display:flex;gap:12px;margin-bottom:16px;">
            <div style="background:#c62828;color:white;padding:6px 14px;border-radius:6px;font-size:12px;font-weight:700;">${e.data}</div>
            <div style="background:#0d47a1;color:white;padding:6px 14px;border-radius:6px;font-size:12px;font-weight:700;">${e.titulo}</div>
          </div>
          <div class="card card-red">
            <p>${e.texto}</p>
            <p style="margin-top:10px;"><b>Evoluiu com:</b></p>
            <ul>${lista}</ul>
            <p style="margin-top:10px;">${e.encaminhamento}</p>
          </div>
        </div>`;
    }

    function renderEvolucao(categoria, titulo) {
      const items = DADOS.evolucoes[categoria].map(ev => {
        const c = CORES[ev.cor] || CORES.blue;
        return `
          <div class="timeline-item" style="border-left-color:${c.dot};">
            <div class="timeline-dot" style="background:${c.dot};box-shadow:0 0 0 1px ${c.dot};"></div>
            <div class="timeline-badge" style="background:${c.bg};color:${c.text};">${ev.data} — ${ev.titulo}</div>
            <div class="timeline-text">${ev.texto}</div>
          </div>
        `;
      }).join('');
      const icone = categoria === 'medica' ? '📈' : categoria === 'fisio' ? '🦵' : '🩺';
      return `<div class="panel"><h2 class="panel-title">${icone} ${titulo}</h2>${items}</div>`;
    }

    function renderProblemas() {
      const items = DADOS.problemas.map(prob => {
        const c = CORES[prob.cor] || CORES.blue;
        return `<div class="problem-item" style="background:${c.bg};border-color:${c.dot};"><b>${prob.numero}.</b> ${prob.texto}</div>`;
      }).join('');
      return `<div class="panel"><h2 class="panel-title">⚠️ Problemas Ativos</h2><div class="grid-problems">${items}</div></div>`;
    }

    function renderAdicionar() {
      return `
        <div class="panel">
          <h2 class="panel-title-green">➕ Adicionar Nova Evolução</h2>
          <div class="hint-box">
            <b>💡 Como funciona:</b> Edite o arquivo <b>dados.json</b> no seu repositório GitHub para adicionar novas evoluções. As alterações aparecerão automaticamente no prontuário após o refresh da página.
          </div>
          <div style="display:flex;flex-direction:column;gap:14px;">
            <div class="form-group">
              <label class="form-label">Data da Evolução</label>
              <input type="date" class="form-input" id="nova-data">
            </div>
            <div class="form-group">
              <label class="form-label">Categoria</label>
              <select class="form-select" id="nova-categoria">
                <option value="medica">Evolução Médica</option>
                <option value="fisio">Evolução Fisioterapêutica</option>
                <option value="enfermagem">Evolução de Enfermagem</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Título</label>
              <input type="text" class="form-input" id="nova-titulo" placeholder="Ex: Reavaliação, Passagem de plantão...">
            </div>
            <div class="form-group">
              <label class="form-label">Descrição da Evolução</label>
              <textarea class="form-textarea" id="nova-texto" placeholder="Descreva a evolução do paciente..."></textarea>
            </div>
            <div class="form-group">
              <label class="form-label">Cor do marcador</label>
              <select class="form-select" id="nova-cor">
                <option value="blue">Azul (padrão)</option>
                <option value="green">Verde (melhora)</option>
                <option value="yellow">Amarelo (atenção)</option>
                <option value="orange">Laranja (alerta)</option>
                <option value="red">Vermelho (crítico)</option>
                <option value="gray">Cinza (estável)</option>
              </select>
            </div>
            <button class="btn-primary" onclick="gerarJSON()">📋 Gerar código JSON para copiar</button>
            <pre id="json-saida" style="background:#1e1e1e;color:#d4d4d4;padding:14px;border-radius:6px;font-size:12px;overflow-x:auto;display:none;"></pre>
          </div>
        </div>`;
    }

    function gerarJSON() {
      const data = document.getElementById('nova-data').value;
      const categoria = document.getElementById('nova-categoria').value;
      const titulo = document.getElementById('nova-titulo').value;
      const texto = document.getElementById('nova-texto').value;
      const cor = document.getElementById('nova-cor').value;

      if (!data || !titulo || !texto) {
        alert('Preencha data, título e descrição.');
        return;
      }

      const dataFormatada = data.split('-').reverse().join('/');
      const novoItem = { data: dataFormatada, titulo, cor, texto };

      const saida = document.getElementById('json-saida');
      saida.style.display = 'block';
      saida.textContent = `// Cole este bloco dentro de "evolucoes.${categoria}" no dados.json:
` + JSON.stringify(novoItem, null, 2) + ',';
    }

    function showTab(tabId) {
      const tabs = ['resumo','dados','historia','antecedentes','evento','evolucao','fisio','enfermagem','problemas','adicionar'];
      tabs.forEach(t => {
        const el = document.getElementById('tab-' + t);
        if (el) el.classList.add('hidden');
        const btn = document.getElementById('btn-' + t);
        if (btn) btn.classList.remove('active');
      });
      const target = document.getElementById('tab-' + tabId);
      if (target) target.classList.remove('hidden');
      const btn = document.getElementById('btn-' + tabId);
      if (btn) btn.classList.add('active');
    }

    carregarDados();
  </script>
</body>
</html>
