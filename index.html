    {"d": "03/08/2026", "ex": "Hemograma", "itens": [{"n": "Hemoglobina", "v": "14,2", "ref": "12,0-16,0", "u": "g/dL", "a": 0}, {"n": "Leucócitos", "v": "12.800", "ref": "4.000-11.000", "u": "/mm³", "a": 1}]},
    {"d": "16/08/2026", "ex": "Gasometria Arterial", "itens": [{"n": "pH", "v": "7,22", "ref": "7,35-7,45", "u": "", "a": 1}, {"n": "PaCO₂", "v": "68", "ref": "35-45", "u": "mmHg", "a": 1}]}
  ],
  "prob": [
    {"n": 1, "x": "TCE frontal com contusões hemorrágicas", "bc": "#c62828", "bg": "#ffebee"},
    {"n": 2, "x": "Trauma cervical C4 com síndrome de Brown-Séquard", "bc": "#c62828", "bg": "#ffebee"},
    {"n": 3, "x": "Câncer pulmonar estadiamento IIIB com metástases ósseas em L1-L3", "bc": "#6a1b9a", "bg": "#f3e5f5"},
    {"n": 4, "x": "Fraturas patológicas em L1, L2 e L3 (estabilizadas com colete lombar)", "bc": "#c62828", "bg": "#ffebee"},
    {"n": 5, "x": "Refratura de rádio e ulna com deslocamento de FETA", "bc": "#c62828", "bg": "#ffebee"},
    {"n": 6, "x": "Pós-operatório de colecistectomia e ruptura de vesícula seminal direita", "bc": "#e65100", "bg": "#fff3e0"},
    {"n": 7, "x": "Neuropatia periférica distal (investigação quimioterápica)", "bc": "#e65100", "bg": "#fff3e0"},
    {"n": 8, "x": "Labilidade emocional e investigação neurológica central", "bc": "#e65100", "bg": "#fff3e0"},
    {"n": 9, "x": "ICFEr (FE 35%) e Cor Pulmonale", "bc": "#0d47a1", "bg": "#e3f2fd"},
    {"n": 10, "x": "Afirmação de identidade de gênero (Nome social: Fronilda)", "bc": "#6a1b9a", "bg": "#f3e5f5"}
  ]
};

function tclk(){const n=new Date(),p=n=>n.toString().padStart(2,'0');document.getElementById('tclk').textContent=`${p(n.getDate())}/${p(n.getMonth()+1)}/${n.getFullYear()} ${p(n.getHours())}:${p(n.getMinutes())}`;}
setInterval(tclk,1000);tclk();

function rBar(){const p=D.p,bh=D.badges.map(b=>`<span class="bd ${b.c}">${b.t}</span>`).join('');document.getElementById('pbar').innerHTML=`<div style="display:flex;align-items:center;gap:10px"><div class="pa">👤</div><div><div class="pn">${p.nome.toUpperCase()} <span>(${p.idade} anos, ${p.sexo})</span></div><div class="pm">Prontuário: <b>${p.prontuario}</b> | Internação: <b>${p.data_internacao}</b> | Setor: <b>${p.setor}</b></div></div></div><div class="bds">${bh}</div>`;}

function rAll(){rBar();document.getElementById('area').innerHTML=`<div id="t-resumo">${rResumo()}</div><div id="t-dados" class="hdn">${rDados()}</div><div id="t-historia" class="hdn">${rHist()}</div><div id="t-antecedentes" class="hdn">${rAnt()}</div><div id="t-evento" class="hdn">${rEvt()}</div><div id="t-evolucao" class="hdn">${rEvo(D.med,'Evolução Médica')}</div><div id="t-fisio" class="hdn">${rEvo(D.fis,'Evolução Fisioterapêutica')}</div><div id="t-enfermagem" class="hdn">${rEvo(D.enf,'Evolução de Enfermagem')}</div><div id="t-imagem" class="hdn">${rImg()}</div><div id="t-laboratorio" class="hdn">${rLab()}</div><div id="t-problemas" class="hdn">${rProb()}</div>`;}

function rResumo(){const r=D.resumo;return`<div class="pn2"><div class="pt">📋 Resumo Clínico da Paciente</div><div class="g2"><div class="cd"><div class="ctt">Identificação</div><div class="cb">${r.id}</div></div><div class="cd" style="border-left-color:#c62828"><div class="ctt">Motivo de Internação</div><div class="cb">${r.motivo}</div></div><div class="cd" style="border-left-color:#e65100"><div class="ctt">Status Atual</div><div class="cb">${r.status}</div></div><div class="cd" style="border-left-color:#2e7d32"><div class="ctt">Comorbidades Principais</div><div class="cbs">${r.comorb}</div></div><div class="cd" style="border-left-color:#6a1b9a"><div class="ctt">Aspectos Psicossociais e Identidade</div><div class="cbs">${r.psico}</div></div><div class="cd" style="border-left-color:#006064"><div class="ctt">Suporte Ventilatório</div><div class="cb">${r.vent}</div></div></div></div>`;}
function rDados(){const p=D.p;return`<div class="pn2"><div class="pt">📊 Dados Antropométricos</div><div class="g4" style="margin-bottom:20px"><div class="mc mcb"><div class="mv">${p.peso} <span class="mu">kg</span></div><div class="ml">PESO ATUAL</div></div><div class="mc mcg"><div class="mv">${p.altura.toString().replace('.',',')} <span class="mu">m</span></div><div class="ml">ESTATURA</div></div><div class="mc mcr"><div class="mv">${p.imc.toString().replace('.',',')}</div><div class="ml">IMC kg/m²</div><div class="ml" style="color:#c62828">OBESIDADE GRAVE</div></div><div class="mc mco"><div class="mv">${p.habitual} <span class="mu">kg</span></div><div class="ml">PESO HABITUAL</div></div></div><div class="abx"><p><b>⚠️ Variação ponderal:</b> ${p.variacao}</p></div></div>`;}
function rHist(){return`<div class="pn2"><div class="pt">👤 História Social e Familiar</div><div style="display:flex;flex-direction:column;gap:14px">${D.hist.map(h=>`<div class="cd" style="border-left-color:${h.bc}"><div style="font-weight:700;color:${h.bc};margin-bottom:6px">${h.t}</div><div class="cbs">${h.x}</div></div>`).join('')}</div></div>`;}
function rAnt(){return`<div class="pn2"><div class="pt">📑 Antecedentes Pessoais</div>${D.ant.map(a=>`<div style="margin-bottom:20px"><div style="background:${a.ch};padding:10px 14px;border-radius:8px 8px 0 0;font-weight:700;color:${a.ct};font-size:14px;border:1px solid ${a.cb};border-bottom:none">${a.t}</div><div style="background:#fafafa;padding:14px;border-radius:0 0 8px 8px;border:1px solid ${a.cb};border-top:none;font-size:13px;line-height:1.7;color:#333">${a.x}</div></div>`).join('')}</div>`;}
function rEvt(){const e=D.evento;return`<div class="pn2"><div class="pt">🚨 História do Evento Atual</div><div style="display:flex;gap:12px;margin-bottom:16px"><div style="background:#c62828;color:#fff;padding:6px 14px;border-radius:6px;font-size:12px;font-weight:700">${e.data}</div><div style="background:#0d47a1;color:#fff;padding:6px 14px;border-radius:6px;font-size:12px;font-weight:700">${e.titulo}</div></div><div class="cd" style="border-left-color:#c62828"><p class="cb">${e.texto}</p><p style="margin-top:10px;font-weight:700">Evoluiu com:</p><ul style="margin:6px 0;padding-left:20px">${e.ev.map(i=>`<li style="margin-bottom:4px">${i}</li>`).join('')}</ul><p style="margin-top:10px" class="cbs">${e.enc}</p><p style="margin-top:10px;font-size:12px;color:#555"><b>SSVV:</b> ${e.ssvv}</p></div></div>`;}
function rEvo(arr,tit){return`<div class="pn2"><div class="pt">${tit}</div>${arr.map(ev=>`<div class="ti" style="border-left-color:${ev.bc}"><div class="td" style="background:${ev.bc};box-shadow:0 0 0 1px ${ev.bc}"></div><div class="tbg" style="background:${ev.bg};color:${ev.tc}">${ev.d} — ${ev.t}</div><div class="ttx">${ev.x}</div></div>`).join('')}</div>`;}
function rImg(){return`<div class="pn2"><div class="pt">🖼️ Exames de Imagem</div>${D.img.map(ex=>`<div style="margin-bottom:16px"><div class="eh">📷 ${ex.tp} <span style="margin-left:auto;font-size:12px;color:#888">${ex.d}</span></div><div class="eb">${ex.x}<div class="ec"><b>Conclusão:</b> ${ex.conc}</div></div></div>`).join('')}</div>`;}
function rLab(){return`<div class="pn2"><div class="pt">🧪 Exames Laboratoriais</div>${D.lab.map(l=>`<div style="margin-bottom:16px"><div class="eh" style="border-radius:8px;border-bottom:1px solid #d0d7de">🧪 ${l.ex} <span style="margin-left:auto;font-size:12px;color:#888">${l.d}</span></div><table class="lt"><thead><tr><th>Parâmetro</th><th>Valor</th><th>Referência</th><th>Unidade</th></tr></thead><tbody>${l.itens.map(it=>`<tr><td>${it.n}</td><td class="${it.a?'la':''}">${it.v}</td><td>${it.ref}</td><td>${it.u}</td></tr>`).join('')}</tbody></table></div>`).join('')}</div>`;}
function rProb(){return`<div class="pn2"><div class="pt">⚠️ Problemas Ativos</div><div class="gp">${D.prob.map(pr=>`<div class="pi" style="background:${pr.bg};border-color:${pr.bc}"><b>${pr.n}.</b>${pr.x}</div>`).join('')}</div></div>`;}

function sh(id){const tabs=['resumo','dados','historia','antecedentes','evento','evolucao','fisio','enfermagem','imagem','laboratorio','problemas'];tabs.forEach(t=>{const el=document.getElementById('t-'+t);if(el)el.classList.add('hdn');const b=document.getElementById('b-'+t);if(b)b.classList.remove('a');});const tr=document.getElementById('t-'+id);if(tr)tr.classList.remove('hdn');const bt=document.getElementById('b-'+id);if(bt)bt.classList.add('a');}

rAll();
</script>

</body>
</html>
