<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
button,input,select,textarea{font:inherit}

.bdo{background:#fff3e0;color:#e65100;border-color:#ffcc80}

.bdp{background:#f3e5f5;color:#6a1b9a;border-color:#ce93d8}

.ptg{margin:0 0 16px 0;font-size:18px;color:#2e7d32;border-bottom:2px solid #c8e6c9;padding-bottom:8px}

.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}

.cb{font-size:14px;color:#333;line-height:1.5}

.mcg{background:linear-gradient(135deg,#e8f5e9,#c8e6c9)}
.mcr{background:linear-gradient(135deg,#ffebee,#ffcdd2)}
.mco{background:linear-gradient(135deg,#fff3e0,#ffe0b2)}

.ml{font-size:12px;color:#555;margin-top:4px;font-weight:600}
.abx{background:#fff8e1;border-radius:8px;padding:14px;border:1px solid #ffe082}

.ti{border-left:3px solid #0d47a1;padding-left:20px;margin-bottom:20px;position:relative}
.td{position:absolute;left:-9px;top:0;width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px}
.tbg{display:inline-block;padding:4px 12px;border-radius:12px;font-size:12px;font-weight:700;margin-bottom:8px}
.ttx{font-size:13px;line-height:1.7;color:#333}
.pi{padding:10px 14px;border-radius:8px;font-size:13px;border-left:3px solid}
.fg{margin-bottom:14px}
.fl{font-size:12px;font-weight:600;color:#555;display:block;margin-bottom:4px}
.fi,.fs,.ft{width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:6px;font-size:13px}
.ft{min-height:120px;resize:vertical}
.fg3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bp2{background:#2e7d32;color:#fff;border:none;padding:12px 24px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer}
.bp2:hover{background:#1b5e20}
.hb3{background:#e8f5e9;border-radius:8px;padding:14px;margin-bottom:16px;font-size:13px;color:#2e7d32}
.cb2{background:#1e1e1e;color:#d4d4d4;padding:14px;border-radius:6px;font-size:12px;overflow-x:auto;font-family:monospace;white-space:pre-wrap;word-break:break-word}
.eh{background:#f5f5f5;padding:10px 14px;border-radius:8px 8px 0 0;font-weight:700;color:#333;font-size:14px;border:1px solid #d0d7de;border-bottom:none}
.eb{background:#fafafa;padding:14px;border-radius:0 0 8px 8px;border:1px solid #d0d7de;border-top:none;font-size:13px;line-height:1.7;color:#333}
.ec{background:#e3f2fd;padding:10px 14px;border-radius:6px;margin-top:10px;font-size:13px;color:#0d47a1;border-left:3px solid #0d47a1}
.lt{width:100%;border-collapse:collapse;font-size:13px}
.lt th{background:#f5f5f5;padding:8px 10px;text-align:left;font-weight:600;color:#555;border-bottom:1px solid #d0d7de;font-size:12px}
.lt td{padding:8px 10px;border-bottom:1px solid #d0d7de;color:#333}
.lt tr:hover td{background:#f5f5f5}
.la{color:#c62828;font-weight:700}
.hdn{display:none !important}
@media(max-width:768px){.sb{width:100%;border-right:none;border-bottom:1px solid #d0d7de}.ly{flex-direction:column}.pbar{flex-direction:column;align-items:flex-start}.fg3{grid-template-columns:1fr}}

<script>
const D={"p":{"nome":"Trastamiro","idade":83,"sexo":"Masculino","prontuario":"083-T/2026","data_internacao":"03/08/2026","setor":"UTI","peso":125,"altura":1.7,"imc":43.3,"habitual":108,"variacao":"Perda ponderal de ~25kg durante internação (edema, paracentese e massa magra). Peso real atualizado para 125kg após calibração de balança."},"badges":[{"t":"TCE Frontal","c":"bdr"},{"t":"Trauma C4","c":"bdr"},{"t":"Lesão Medular","c":"bdr"},{"t":"Câncer Pulmão IIIB","c":"bdp"},{"t":"SAOS Grave","c":"bdo"},{"t":"Obesidade Grave","c":"bdo"},{"t":"ICFEp","c":"bdb"},{"t":"RASS -1","c":"bdg"},{"t":"Brown-Séquard","c":"bdr"},{"t":"Hipercapnia","c":"bdo"},{"t":"Metástases ósseas","c":"bdp"},{"t":"ICFEr (FE 35%)","c":"bdr"},{"t":"Cor Pulmonale","c":"bdo"},{"t":"Uso de BiPAP","c":"bdb"},{"t":"Pós-Op Ortopédico","c":"bdg"}],"resumo":{"id":"Paciente masculino, 83 anos, prontuário 083-T/2026. Internado em UTI desde 03/08/2026. Irmão gêmeo de Astrogildo (falecido).","motivo":"TCE frontal e trauma cervical em C4 após acidente motociclístico sem capacete. Realizava manobra de empinamento quando perdeu controle.","status":"Consciente e comunicativo, porém com importante limitação funcional. Pós-operatório de fixação de fratura de rádio e ulna (queda em 24/08). Mantém uso de BiPAP noturno/intermitente por SAOS grave e cor pulmonale. Rebaixamento prévio resolvido após suporte ventilatório.","comorb":"Câncer pulmonar de grandes células (estádio IIIB), SAOS grave (IAH 115/h), hipercapnia, ICFEp, obesidade grave (IMC 54,7), prótese total de joelho esquerdo.; síndrome de Brown-Séquard associada à lesão medular traumática em C4.; progressão da neoplasia pulmonar com metástases ósseas em coluna vertebral e fígado; episódio recente de acidemia hipercápnica.; IC com fração de ejeção reduzida (FE 35%); Cor Pulmonale; DPOC GOLD D; Fratura de rádio e ulna fixada cirurgicamente.","psico":"Luto pelo irmão gêmeo Astrogildo. Ausência de suporte familiar. Comportamento questionador e desconfiado desde internação. Reaparecimento e posterior desaparecimento da filha após apropriação de prêmio de loteria (R$ 10 milhões). Interesse em atividades artísticas (Drag Race) como fator de motivação.","vent":"Extubado em 17/08. Apresentou hipercapnia e rebaixamento, necessitando de BiPAP intermitente com boa resposta. Mantém suporte não invasivo para controle de SAOS e cor pulmonale."},"hist":[{"t":"Luto e ganho ponderal","x":"Após falecimento do irmão gêmeo Astrogildo, paciente apresentou ganho ponderal aproximado de 50 kg.","bc":"#c62828"},{"t":"Redução de atividades","x":"Deixou de cuidar da horta e plantar verduras. Deixou o hábito de fumar 'paiero' com amigos. Redução importante da participação em atividades sociais e de lazer.","bc":"#e65100"},{"t":"Declínio funcional","x":"Menor disposição física nos últimos meses. Sono fragmentado com interrupções noturnas para micção. Marcha com apoio em corrimão, subia escadas lentamente.","bc":"#0d47a1"},{"t":"Aspectos psicológicos","x":"Demonstra tristeza relacionada ao falecimento do irmão. Desde a internação atual apresenta comportamento mais questionador, desconfiado e menor colaboração com a equipe.","bc":"#6a1b9a"}],"ant":[{"t":"Ortopedia","x":"Osteossarcoma em joelho esquerdo aos 25 anos. Submetido à ressecção cirúrgica e colocação de prótese total de joelho esquerdo. Recuperação da marcha após procedimento.","ch":"#f5f5f5","ct":"#333","cb":"#d0d7de"},{"t":"Apneia do Sono","x":"SAOS grave. IAH: 115 eventos/hora. Hipercapnia importante. Uso domiciliar de BiPAP.","ch":"#fff3e0","ct":"#e65100","cb":"#ffcc80"},{"t":"Oncologia","x":"Câncer pulmonar de grandes células em tratamento. Massa pulmonar direita de aproximadamente 8,2 cm. Linfonodomegalias mediastinais. Estadiamento: cT4N2M0, estádio IIIB.","ch":"#f3e5f5","ct":"#6a1b9a","cb":"#ce93d8"},{"t":"Cardiovascular","x":"ICFEp. Ecocardiograma prévio: FEVE 62%, disfunção diastólica grau II, hipertrofia concêntrica moderada do VE, átrio esquerdo moderadamente aumentado, PSAP estimada 45 mmHg.","ch":"#ffebee","ct":"#c62828","cb":"#ef9a9a"},{"t":"Nutrição","x":"Obesidade grave. IMC 54,7 kg/m². Peso atual 158 kg (peso habitual ~108 kg). Ganho de ~50 kg após luto.","ch":"#fff3e0","ct":"#e65100","cb":"#ffcc80"}],"evento":{"data":"03/08/2026","titulo":"Admissão Médica","texto":"Paciente masculino, 83 anos, admitido após acidente motociclístico. Realizava manobra de empinamento quando perdeu o controle e sofreu queda com impacto frontal da cabeça. Sem capacete. Após o trauma apresentou rebaixamento do nível de consciência.","ev":["TCE frontal e trauma cervical em nível C4","Lesão medular parcial posterior em C4 (inicialmente suspeita de anterior)","Rebaixamento do nível de consciência","Insuficiência respiratória","Intubação orotraqueal e VM invasiva","Sedação"],"enc":"Encaminhado à UTI para suporte intensivo, monitorização contínua e investigação neurológica.","ssvv":"PA: 158/92 mmHg | FC: 104 bpm | FR: 22 irpm | SpO2: 94% em VM | T: 36,4°C"},"med":[{"d":"03/08/2026","t":"Admissão","bc":"#c62828","bg":"#ffebee","tc":"#c62828","x":"Paciente admitido após acidente motociclístico. TCE frontal, trauma cervical C4, lesão medular parcial. IOT, VM invasiva, sedação. SSVV: PA 158/92, FC 104, FR 22, SpO2 94%, T 36,4°C."},{"d":"04/08/2026","t":"Reavaliação","bc":"#e65100","bg":"#fff3e0","tc":"#e65100","x":"Permanece sedado, intubado e em VM. Divergência na classificação inicial da lesão cervical: hipótese de lesão medular parcial anterior em C4 revista. Quadro passa a ser mais compatível com lesão medular parcial posterior em C4."},{"d":"05/08/2026","t":"Evolução","bc":"#0d47a1","bg":"#e3f2fd","tc":"#0d47a1","x":"Paciente permanece em UTI, sedado e em VM invasiva. Mantém diagnóstico de TCE frontal e lesão cervical C4. Mantidas demais comorbidades prévias. Sem novas intercorrências."},{"d":"06/08/2026","t":"Evolução","bc":"#0d47a1","bg":"#e3f2fd","tc":"#0d47a1","x":"Paciente permanece sedado, intubado e em VM. Sem alteração clínica significativa. Mantido suporte intensivo."},{"d":"07/08/2026","t":"Evolução","bc":"#0d47a1","bg":"#e3f2fd","tc":"#0d47a1","x":"Paciente permanece em VM e sob sedação. Mantidos diagnósticos prévios. Sem novas intercorrências."},{"d":"08/08/2026","t":"Evolução","bc":"#0d47a1","bg":"#e3f2fd","tc":"#0d47a1","x":"Paciente permanece em UTI, intubado, sedado e em VM invasiva. Sem novas intercorrências registradas."},{"d":"09/08/2026","t":"Evolução","bc":"#f57f17","bg":"#fff8e1","tc":"#f57f17","x":"Paciente permanece sedado, intubado e em VM. Mantidos cuidados intensivos. Programada suspensão progressiva da sedação conforme avaliação clínica."},{"d":"10/08/2026","t":"Suspensão da sedação","bc":"#2e7d32","bg":"#e8f5e9","tc":"#2e7d32","x":"Sedação suspensa. Paciente inicia processo de despertar. RASS: -1. Sonolento, despertável ao chamado. Apresenta interação inicial com a equipe. Mantém-se intubado e em VM. SSVV: PA 142/84, FC 92, FR 20, SpO2 95%, T 36,7°C."},{"d":"11/08/2026","t":"Evolução","bc":"#0d47a1","bg":"#e3f2fd","tc":"#0d47a1","x":"Paciente permanece em UTI, intubado e em ventilação mecânica invasiva após suspensão da sedação. Glasgow 8T: abertura ocular 2, resposta verbal 1T, não testável devido ao tubo orotraqueal, resposta motora 4. Mantém lesão medular cervical em C4. Após revisão dos exames e correlação com avaliação neurológica, quadro compatível com síndrome de Brown-Séquard. Mantido acompanhamento neurológico e respiratório."},{"d":"12/08/2026","t":"Evolução","bc":"#0d47a1","bg":"#e3f2fd","tc":"#0d47a1","x":"Paciente permanece em ventilação mecânica invasiva. Mantém diagnóstico de TCE frontal, lesão medular cervical em C4 e síndrome de Brown-Séquard. Em acompanhamento para redução progressiva do suporte ventilatório."},{"d":"13/08/2026","t":"Teste de respiração espontânea","bc":"#f57f17","bg":"#fff8e1","tc":"#f57f17","x":"Paciente permanece em UTI, em acompanhamento após início de teste de respiração espontânea. Mantém lesão cerebral frontal traumática com acometimento orbitofrontal correspondente à área 11 de Brodmann. Lesão medular traumática em C4 compatível com síndrome de Brown-Séquard. Permanece intubado."},{"d":"14/08/2026","t":"Evolução","bc":"#0d47a1","bg":"#e3f2fd","tc":"#0d47a1","x":"Paciente permanece em ventilação mecânica invasiva. Após períodos de teste de respiração espontânea, mantém necessidade de suporte ventilatório. Sem novas alterações neurológicas descritas. Mantém acompanhamento para possível extubação conforme evolução."},{"d":"15/08/2026","t":"Evolução","bc":"#0d47a1","bg":"#e3f2fd","tc":"#0d47a1","x":"Paciente permanece em ventilação mecânica invasiva. Apresenta melhor tolerância aos períodos de respiração espontânea. Mantida programação de novos testes de respiração espontânea."},{"d":"16/08/2026","t":"Avaliação para extubação","bc":"#f57f17","bg":"#fff8e1","tc":"#f57f17","x":"Paciente apresenta boa tolerância aos períodos de respiração espontânea. Mantém estabilidade clínica. Avaliado para extubação no dia seguinte, conforme manutenção dos parâmetros atuais."},{"d":"17/08/2026","t":"Extubação","bc":"#2e7d32","bg":"#e8f5e9","tc":"#2e7d32","x":"Paciente submetido a teste de respiração espontânea, com boa tolerância. Após avaliação clínica, realizada extubação com sucesso. Mantém respiração espontânea após retirada do tubo. Sem intercorrências imediatas."},{"d":"16/08/2026","t":"Intercorrência: hipercapnia e rebaixamento","bc":"#e65100","bg":"#fff3e0","tc":"#e65100","x":"Paciente com neoplasia pulmonar de grandes células, estádio III, com progressão da doença e aparecimento de metástases ósseas em coluna vertebral e fígado. Durante o período noturno, apresentou piora importante da retenção de CO₂, associada a rebaixamento do nível de consciência. Gasometria arterial: pH 7,22, PaCO₂ 68 mmHg, PaO₂ 125 mmHg, HCO₃⁻ 28 mEq/L, BE +4. Quadro compatível com acidemia associada à hipercapnia importante. Mantém lesão medular C4, síndrome de Brown-Séquard, TCE frontal, ICFEp e história de SAOS grave com IAH 115 eventos/h e hipercapnia."},{"d":"17/08/2026","t":"Complemento pós-extubação","bc":"#e65100","bg":"#fff3e0","tc":"#e65100","x":"Paciente permanece com rebaixamento do nível de consciência após episódio de hipercapnia importante durante a noite. Apesar do rebaixamento neurológico, foi submetido a teste de respiração espontânea e posteriormente extubado. Após extubação, mantém respiração espontânea, porém sem recuperação adequada do nível de consciência. Mantida vigilância respiratória e neurológica e investigação da causa do rebaixamento persistente."},{"d":"18/08/2026","t":"Hipótese de RNC por hipercapnia","bc":"#e65100","bg":"#fff3e0","tc":"#e65100","x":"Paciente permanece em pós-extubação com rebaixamento do nível de consciência. Hipótese de RNC secundário à hipercapnia ganha probabilidade devido ao histórico de SAOS grave (IAH 115/h). Reiniciado BiPAP com melhora progressiva da eliminação de CO₂ e do nível de consciência."},{"d":"19/08/2026","t":"Avaliação Neurológica (ASIA)","bc":"#0d47a1","bg":"#e3f2fd","tc":"#0d47a1","x":"Melhora do nível de consciência com BiPAP. Avaliação neurológica (ASIA) compatível com lesão medular parcial em C4. Hemicorpo direito: comprometimento de força, propriocepção e sensibilidade profunda. Hemicorpo esquerdo: comprometimento de sensibilidade superficial (dor, temperatura, pressão)."},{"d":"20/08/2026","t":"Revisão de Peso e Volemia","bc":"#e65100","bg":"#fff3e0","tc":"#e65100","x":"Paciente consciente mas sonolento. Mantém BiPAP. Identificada inconsistência na pesagem anterior (balança descalibrada). Peso real aferido: 125 kg. Iniciada investigação cardiovascular por edema periférico importante."},{"d":"21/08/2026","t":"Balanço Hídrico e Perda Ponderal","bc":"#0d47a1","bg":"#e3f2fd","tc":"#0d47a1","x":"Peso 125 kg (perda de ~25kg na internação: 5kg massa, 5kg edema/diurético, 15kg paracentese). Mantém sinais de sobrecarga volêmica. Solicitado novo ecocardiograma."},{"d":"22/08/2026","t":"Piora Cardiovascular","bc":"#c62828","bg":"#ffebee","tc":"#c62828","x":"Ecocardiograma: FEVE 35%, disfunção de VD e remodelamento com hipertrofia excêntrica. Quadro compatível com IC com fração de ejeção reduzida e cor pulmonale (DPOC GOLD D). Mantida diureticoterapia."},{"d":"23/08/2026","t":"Dor Lombar Limitante","bc":"#e65100","bg":"#fff3e0","tc":"#e65100","x":"Dor lombar importante durante mudanças de posição. Paciente passa a evitar movimentação espontânea e reduz participação em atividades."},{"d":"24/08/2026","t":"Queda e Fratura","bc":"#c62828","bg":"#ffebee","tc":"#c62828","x":"Queda da própria altura durante tentativa de transferência. Identificada fratura de rádio e ulna (antebraço) em três partes. Realizada imobilização e avaliação ortopédica."},{"d":"25/08/2026","t":"Restrição Funcional","bc":"#e65100","bg":"#fff3e0","tc":"#e65100","x":"Mantida restrição do membro superior. Dor lombar persiste com redução da mobilidade no leito e resistência a posicionamentos."},{"d":"26/08/2026","t":"Fixação Cirúrgica","bc":"#2e7d32","bg":"#e8f5e9","tc":"#2e7d32","x":"Submetido a fixação de fratura de rádio e ulna com FETA. Sem intercorrências pós-operatórias imediatas."},{"d":"27/08/2026","t":"Questão Social e Familiar","bc":"#6a1b9a","bg":"#f3e5f5","tc":"#6a1b9a","x":"Relato de reaparecimento de contato familiar (filha e neto). Filha encontrou bilhete premiado (R$ 10 milhões) na residência do paciente, sacou o prêmio e encontra-se desaparecida. Paciente mantém dor lombar e redução da mobilidade."}],"fis":[{"d":"03/08/2026","t":"Avaliação inicial","bc":"#c62828","bg":"#ffebee","tc":"#c62828","x":"Paciente em UTI, intubado, sedado, em VM. Avaliação funcional não realizada devido à sedação. Tentado TUG, IMS, Borg, MRC — sem condições. Conduta: acompanhamento respiratório e VM. SSVV: FC 102, FR 20, SpO2 93%, PA 151/88."},{"d":"04/08/2026","t":"Acompanhamento","bc":"#0d47a1","bg":"#e3f2fd","tc":"#0d47a1","x":"Paciente sedado, intubado e em VM. Tentada MRC, IMS, Borg, TUG — sem resposta adequada. Paciente permanece restrito ao leito. SSVV: PA 146/84, FC 98, FR 19, SpO2 95%, T 36,6°C."},{"d":"05/08/2026","t":"Acompanhamento","bc":"#0d47a1","bg":"#e3f2fd","tc":"#0d47a1","x":"Paciente permanece sedado e em VM. IMS, MRC, Borg, TUG não aplicáveis. Tentativa de avaliação de força de MMII sem resposta consistente. Mantido acompanhamento respiratório."},{"d":"06/08/2026","t":"Acompanhamento","bc":"#0d47a1","bg":"#e3f2fd","tc":"#0d47a1","x":"Paciente restrito ao leito. IMS, MRC, TUG, Borg não realizados. NYHA classe III (história prévia). Conduta: acompanhamento respiratório e mobilização passiva no leito."},{"d":"07/08/2026","t":"Acompanhamento","bc":"#0d47a1","bg":"#e3f2fd","tc":"#0d47a1","x":"Paciente sedado. MRC, IMS, TUG, Borg não concluídos. Tentada Escala de Berg e Índice de Barthel — sem possibilidade. Paciente dependente para mobilidade."},{"d":"08/08/2026","t":"Acompanhamento","bc":"#0d47a1","bg":"#e3f2fd","tc":"#0d47a1","x":"Paciente sedado. Avaliação de força muscular respiratória, manovacuometria, mMRC, Borg — não realizadas devido à VM e nível de consciência. Mantido acompanhamento da VM."},{"d":"09/08/2026","t":"Acompanhamento","bc":"#0d47a1","bg":"#e3f2fd","tc":"#0d47a1","x":"Paciente sedado. Índice de Barthel, TUG, IMS, MRC — sem possibilidade. Paciente dependente para mobilidade. Mantido acompanhamento respiratório."},{"d":"10/08/2026","t":"Despertar","bc":"#2e7d32","bg":"#e8f5e9","tc":"#2e7d32","x":"Sedação suspensa, RASS -1. Sonolento, despertável. MRC incompleta (dificuldade para comandos). IMS parcial, baixa participação. TUG não realizado (VM). Borg, mMRC não aplicáveis. Barthel por estimativa: dependência importante. Berg não realizada (impossibilidade de ortostatismo). NYHA III. STOP-Bang registrado (SAOS grave). Epworth, FOSQ, Mini Sleep não concluídos. Dessaturação para 89% durante avaliação (interrompida). Após repouso, SpO2 retornou para 94%."},{"d":"11/08/2026","t":"Avaliação respiratória e funcional","bc":"#0d47a1","bg":"#e3f2fd","tc":"#0d47a1","x":"Paciente em UTI, intubado, em ventilação mecânica invasiva. FiO₂ reduzida para 40%. Tosse presente, produtiva e eficaz, com secreção traqueobrônquica moderada. Realizada higiene brônquica, com melhora da ausculta. Peak flow: 165 L/min. Glasgow 8T. MRC sem escore confiável; IMS sem condições de sedestação ou transferência; NYHA inadequada no momento. Durante mobilização passiva, SpO₂ caiu transitoriamente para 88%, com recuperação após interrupção. Mantida mobilização passiva conforme tolerância."},{"d":"12/08/2026","t":"Início do TRE","bc":"#f57f17","bg":"#fff8e1","tc":"#f57f17","x":"Paciente em ventilação mecânica invasiva, FiO₂ 40%, com tosse produtiva e eficaz. Iniciado teste de respiração espontânea. Durante o teste: FR 24 irpm, SpO₂ 95%, FC 86 bpm, sem sinais de desconforto respiratório. Paciente mais desperto. MRC sem pontuação completa confiável. Anamnese indireta registra redução progressiva da atividade física, fadiga e dispneia aos esforços antes da internação, além de abandono de atividades habituais."},{"d":"13/08/2026","t":"Avaliação motora parcial","bc":"#e65100","bg":"#fff3e0","tc":"#e65100","x":"Paciente em VMI, FiO₂ 40%, com tosse produtiva e secreção traqueobrônquica; realizada higiene brônquica. Mantido TRE, interrompido momentaneamente por aumento transitório da FR para 31 irpm e SpO₂ 91%, com retorno após repouso. MRC parcial: membro superior esquerdo 3/5, superior direito 2/5, inferior esquerdo 2/5 e inferior direito 1/5. Mantém-se restrito ao leito. Joelho esquerdo com ADM passiva aproximada de 0–95°, sem sinais clínicos de instabilidade. Berg não aplicável por ausência de ortostatismo. Durante TRE, taquicardia transitória até 108 bpm, com recuperação após interrupção."},{"d":"14/08/2026","t":"Melhor tolerância ao TRE","bc":"#0d47a1","bg":"#e3f2fd","tc":"#0d47a1","x":"Paciente em VMI, FiO₂ 40%, com tosse produtiva e secreção pequena a moderada; realizada higiene brônquica. Novo TRE com FR 22–25 irpm, SpO₂ 94–96% e FC 82–96 bpm, com melhor tolerância. Maior abertura ocular. IMS: 1, apenas mobilidade no leito; não consegue sentar sem auxílio. Mantida mobilização ativa-assistida. Escalas de Borg sem resultado confiável devido à intubação. Em acompanhamento por neoplasia pulmonar."},{"d":"15/08/2026","t":"Progressão motora","bc":"#0d47a1","bg":"#e3f2fd","tc":"#0d47a1","x":"Paciente em VMI, FiO₂ 40%, com tosse produtiva e secreção; realizada higiene brônquica. TRE com boa tolerância: FR 20–24 irpm, SpO₂ 95–97%, FC 78–92 bpm, sem desconforto. Mais desperto e capaz de seguir comandos simples. MRC: membros superiores esquerdo 4/5 e direito 3/5; membros inferiores esquerdo 3/5 e direito 2/5. Mantém déficit motor assimétrico, predominando à direita, e dependência para mobilidade. Prótese de joelho esquerdo sem complicação aguda."},{"d":"16/08/2026","t":"Preparação para extubação","bc":"#2e7d32","bg":"#e8f5e9","tc":"#2e7d32","x":"Paciente em VMI, FiO₂ 40%, com tosse produtiva e pouca secreção. TRE bem tolerado: FR 18–22 irpm, SpO₂ 96–98%, FC 76–88 bpm, sem desconforto. Desperto, colaborativo e capaz de seguir comandos simples. Mantém déficit motor assimétrico, predominando à direita. IMS: 2, movimentação ativa no leito, sem sedestação independente. Considerada história de SAOS grave, IAH 115 eventos/h, uso domiciliar de BiPAP e hipercapnia. Epworth sem escore confiável."},{"d":"17/08/2026","t":"Pós-extubação e avaliação funcional","bc":"#2e7d32","bg":"#e8f5e9","tc":"#2e7d32","x":"Paciente extubado após TRE, sem intercorrências imediatas. Mantém respiração espontânea, tosse produtiva e eficaz, sem sinais imediatos de obstrução; SpO₂ 95% em ar ambiente após observação inicial. Desperto, comunicativo e segue comandos simples. Apresenta comportamento expansivo e espontâneo, com dificuldade ocasional de inibição e mudanças rápidas do conteúdo emocional ao abordar o falecimento do irmão. Relata atividade como drag queen, nome artístico Miss Fortune Monsoon, desejo de participar do RuPaul's Drag Race, relacionamento com Agi Otta e fila de adoção. Após extubação, realiza sedestação à beira-leito com assistência moderada por aproximadamente 4 minutos, com controle de tronco reduzido. Não realizado ortostatismo. FC 82→101 bpm, PA 136/78→148/82 mmHg, SpO₂ 94–96%, Borg modificada 3/10. Mantém déficit motor maior à direita e prótese de joelho esquerdo sem intercorrência aguda. Relata ganho ponderal aproximado de 50 kg após o falecimento do irmão, redução da atividade física e afastamento familiar por não aceitação de sua atuação como drag queen."},{"d":"16/08/2026","t":"Intercorrência respiratória","bc":"#e65100","bg":"#fff3e0","tc":"#e65100","x":"Paciente em VMI, em acompanhamento fisioterapêutico respiratório, com história de SAOS grave, IAH 115 eventos/h, hipercapnia importante e acompanhamento regular com fisioterapia do sono. Durante a noite, evoluiu com piora da hipercapnia e rebaixamento do nível de consciência. Gasometria: pH 7,22; PaCO₂ 68 mmHg; PaO₂ 125 mmHg; HCO₃⁻ 28 mEq/L; BE +4. Paciente permanece rebaixado. Escala de Epworth sem resultado confiável devido à condição clínica."},{"d":"17/08/2026","t":"Pós-extubação com rebaixamento","bc":"#e65100","bg":"#fff3e0","tc":"#e65100","x":"Paciente permanece com rebaixamento do nível de consciência após episódio de hipercapnia durante a madrugada. Realizado TRE, evoluindo posteriormente para extubação. Após extubação, mantém respiração espontânea e tosse produtiva e eficaz, porém permanece rebaixado e sem recuperação adequada do nível de consciência. Mantida monitorização respiratória e neurológica, com observação da evolução da ventilação e do nível de consciência."},{"d":"17/08/2026","t":"Complemento da evolução","bc":"#e65100","bg":"#fff3e0","tc":"#e65100","x":"Após extubação, paciente não apresentou recuperação esperada do nível de consciência. Mantém padrão de rebaixamento neurológico, temporalmente associado ao episódio de hipercapnia ocorrido durante a noite anterior."},{"d":"18/08/2026","t":"Início de BiPAP","bc":"#e65100","bg":"#fff3e0","tc":"#e65100","x":"Paciente pós-extubação com rebaixamento e hipoventilação. Iniciado BiPAP devido à SAOS grave. Observado aumento progressivo da interação após suporte. Tosse produtiva, higiene brônquica realizada. Restrito ao leito."},{"d":"19/08/2026","t":"Avaliação Motora e Sensitiva","bc":"#0d47a1","bg":"#e3f2fd","tc":"#0d47a1","x":"Mais desperto, boa tolerância ao BiPAP. FR 20, SpO2 95%, FC 84. Déficit motor e sensitivo predominante em hemicorpo direito. Mantida mobilização ativa-assistida."},{"d":"20/08/2026","t":"Limitação por Dor Lombar","bc":"#e65100","bg":"#fff3e0","tc":"#e65100","x":"Consciente, sonolento. Queixa de dor lombar. Tentada sedestação: tolerou 3 min, interrompida por dor. Borg 4/10. Baixa participação."},{"d":"21/08/2026","t":"Sedestação Assistida","bc":"#0d47a1","bg":"#e3f2fd","tc":"#0d47a1","x":"Maior participação. Sedestação à beira-leito por 5 min com assistência. Controle de tronco reduzido, fadiga ao final. Borg 3/10. Edema em redução."},{"d":"22/08/2026","t":"Restrição por IC","bc":"#e65100","bg":"#fff3e0","tc":"#e65100","x":"Avaliado após eco (FEVE 35%). Durante mobilização, FC subiu para 103 e SpO2 caiu para 92%. Atividade reduzida para baixa intensidade devido à resposta cardiorrespiratória."},{"d":"23/08/2026","t":"Insegurança na Transferência","bc":"#e65100","bg":"#fff3e0","tc":"#e65100","x":"Importante limitação funcional por dor lombar. Tentada transferência para cadeira: interrompida por insegurança e falta de controle de tronco."},{"d":"24/08/2026","t":"Intercorrência: Queda","bc":"#c62828","bg":"#ffebee","tc":"#c62828","x":"Queda durante tentativa de saída do leito. Dor intensa em antebraço com limitação importante. Atendimento interrompido e equipe acionada."},{"d":"25/08/2026","t":"Mobilização Restrita","bc":"#e65100","bg":"#fff3e0","tc":"#e65100","x":"Fratura de rádio e ulna. Membro imobilizado. Suspensas cargas no membro afetado. Dor lombar persiste, necessita de assistência total para mobilidade no leito."},{"d":"26/08/2026","t":"Pós-O function tclk(){const n=new Date(),p=n=>n.toString().padStart(2,'0');document.getElementById('tclk').textContent=`${p(n.getDate())}/${p(n.getMonth()+1)}/${n.getFullYear()} ${p(n.getHours())}:${p(n.getMinutes())}`;}
setInterval(tclk,1000);tclk();

function rBar(){const p=D.p,bh=D.badges.map(b=>`<span class="bd ${b.c}">${b.t}</span>`).join('');document.getElementById('pbar').innerHTML=`<div style="display:flex;align-items:center;gap:10px"><div class="pa">👤</div><div><div class="pn">${p.nome.toUpperCase()} <span>(${p.idade} anos, ${p.sexo})</span></div><div class="pm">Prontuário: <b>${p.prontuario}</b> | Internação: <b>${p.data_internacao}</b> | Setor: <b>${p.setor}</b></div></div></div><div class="bds">${bh}</div>`;}

function rAll(){rBar();document.getElementById('area').innerHTML=`<div id="t-resumo">${rResumo()}</div><div id="t-dados" class="hdn">${rDados()}</div><div id="t-historia" class="hdn">${rHist()}</div><div id="t-antecedentes" class="hdn">${rAnt()}</div><div id="t-evento" class="hdn">${rEvt()}</div><div id="t-evolucao" class="hdn">${rEvo(D.med,'Evolução Médica')}</div><div id="t-fisio" class="hdn">${rEvo(D.fis,'Evolução Fisioterapêutica')}</div><div id="t-enfermagem" class="hdn">${rEvo(D.enf,'Evolução de Enfermagem')}</div><div id="t-imagem" class="hdn">${rImg()}</div><div id="t-laboratorio" class="hdn">${rLab()}</div><div id="t-problemas" class="hdn">${rProb()}</div><div id="t-add-ev" class="hdn">${rAddEv()}</div><div id="t-add-img" class="hdn">${rAddImg()}</div><div id="t-add-lab" class="hdn">${rAddLab()}</div>`;}

function rResumo(){const r=D.resumo;return`<div class="pn2"><div class="pt">📋 Resumo Clínico do Paciente</div><div class="g2"><div class="cd"><div class="ctt">Identificação</div><div class="cb">${r.id}</div></div><div class="cd" style="border-left-color:#c62828"><div class="ctt">Motivo de Internação</div><div class="cb">${r.motivo}</div></div><div class="cd" style="border-left-color:#e65100"><div class="ctt">Status Atual</div><div class="cb">${r.status}</div></div><div class="cd" style="border-left-color:#2e7d32"><div class="ctt">Comorbidades Principais</div><div class="cbs">${r.comorb}</div></div><div class="cd" style="border-left-color:#6a1b9a"><div class="ctt">Aspectos Psicossociais</div><div class="cbs">${r.psico}</div></div><div class="cd" style="border-left-color:#006064"><div class="ctt">Suporte Ventilatório</div><div class="cb">${r.vent}</div></div></div></div>`;}

function rDados(){const p=D.p;return`<div class="pn2"><div class="pt">📊 Dados Antropométricos</div><div class="g4" style="margin-bottom:20px"><div class="mc mcb"><div class="mv">${p.peso} <span class="mu">kg</span></div><div class="ml">PESO ATUAL</div></div><div class="mc mcg"><div class="mv">${p.altura.toString().replace('.',',')} <span class="mu">m</span></div><div class="ml">ESTATURA</div></div><div class="mc mcr"><div class="mv">${p.imc.toString().replace('.',',')}</div><div class="ml">IMC kg/m²</div><div class="ml" style="color:#c62828">OBESIDADE GRAVE</div></div><div class="mc mco"><div class="mv">${p.habitual} <span class="mu">kg</span></div><div class="ml">PESO HABITUAL</div></div></div><div class="abx"><p><b>⚠️ Variação ponderal:</b> ${p.variacao}</p></div></div>`;}

function rHist(){return`<div class="pn2"><div class="pt">👤 História Social e Familiar</div><div style="display:flex;flex-direction:column;gap:14px">${D.hist.map(h=>`<div class="cd" style="border-left-color:${h.bc}"><div style="font-weight:700;color:${h.bc};margin-bottom:6px">${h.t}</div><div class="cbs">${h.x}</div></div>`).join('')}</div></div>`;}

function rAnt(){return`<div class="pn2"><div class="pt">📑 Antecedentes Pessoais</div>${D.ant.map(a=>`<div style="margin-bottom:20px"><div style="background:${a.ch};padding:10px 14px;border-radius:8px 8px 0 0;font-weight:700;color:${a.ct};font-size:14px;border:1px solid ${a.cb};border-bottom:none">${a.t}</div><div style="background:#fafafa;padding:14px;border-radius:0 0 8px 8px;border:1px solid ${a.cb};border-top:none;font-size:13px;line-height:1.7;color:#333">${a.x}</div></div>`).join('')}</div>`;}

function rEvt(){const e=D.evento;return`<div class="pn2"><div class="pt">🚨 História do Evento Atual</div><div style="display:flex;gap:12px;margin-bottom:16px"><div style="background:#c62828;color:#fff;padding:6px 14px;border-radius:6px;font-size:12px;font-weight:700">${e.data}</div><div style="background:#0d47a1;color:#fff;padding:6px 14px;border-radius:6px;font-size:12px;font-weight:700">${e.titulo}</div></div><div class="cd" style="border-left-color:#c62828"><p class="cb">${e.texto}</p><p style="margin-top:10px;font-weight:700">Evoluiu com:</p><ul style="margin:6px 0;padding-left:20px">${e.ev.map(i=>`<li style="margin-bottom:4px">${i}</li>`).join('')}</ul><p style="margin-top:10px" class="cbs">${e.enc}</p><p style="margin-top:10px;font-size:12px;color:#555"><b>SSVV:</b> ${e.ssvv}</p></div></div>`;}

function rEvo(arr,tit){return`<div class="pn2"><div class="pt">${tit}</div>${arr.map(ev=>`<div class="ti" style="border-left-color:${ev.bc}"><div class="td" style="background:${ev.bc};box-shadow:0 0 0 1px ${ev.bc}"></div><div class="tbg" style="background:${ev.bg};color:${ev.tc}">${ev.d} — ${ev.t}</div><div class="ttx">${ev.x}</div></div>`).join('')}</div>`;}

function rImg(){return`<div class="pn2"><div class="pt">🖼️ Exames de Imagem</div>${D.img.map(ex=>`<div style="margin-bottom:16px"><div class="eh">📷 ${ex.tp} <span style="margin-left:auto;font-size:12px;color:#888">${ex.d}</span></div><div class="eb">${ex.x}<div class="ec"><b>Conclusão:</b> ${ex.conc}</div></div></div>`).join('')}</div>`;}

function rLab(){return`<div class="pn2"><div class="pt">🧪 Exames Laboratoriais</div>${D.lab.map(l=>`<div style="margin-bottom:16px"><div class="eh" style="border-radius:8px;border-bottom:1px solid #d0d7de">🧪 ${l.ex} <span style="margin-left:auto;font-size:12px;color:#888">${l.d}</span></div><table class="lt"><thead><tr><th>Parâmetro</th><th>Valor</th><th>Referência</th><th>Unidade</th></tr></thead><tbody>${l.itens.map(it=>`<tr><td>${it.n}</td><td class="${it.a?'la':''}">${it.v}</td><td>${it.ref}</td><td>${it.u}</td></tr>`).join('')}</tbody></table></div>`).join('')}</div>`;}

function rProb(){return`<div class="pn2"><div class="pt">⚠️ Problemas Ativos</div><div class="gp">${D.prob.map(pr=>`<div class="pi" style="background:${pr.bg};border-color:${pr.bc}"><b>${pr.n}.</b> ${pr.x}</div>`).join('')}</div></div>`;}

function rAddEv(){return`<div class="pn2"><div class="ptg">➕ Adicionar Nova Evolução</div><div class="hb3"><b>💡 Como funciona:</b> A Profª Natália quem faz, aluno não mexe aqui.</div><div class="fg"><label class="fl">Data da Evolução</label><input type="date" class="fi" id="ed"></div><div class="fg"><label class="fl">Categoria</label><select class="fs" id="ec"><option value="medica">Evolução Médica</option><option value="fisio">Fisioterapia</option><option value="enfermagem">Enfermagem</option></select></div><div class="fg"><label class="fl">Título</label><input type="text" class="fi" id="et" placeholder="Ex: Reavaliação, Passagem de plantão..."></div><div class="fg"><label class="fl">Descrição da Evolução</label><textarea class="ft" id="ex" placeholder="Descreva a evolução do paciente..."></textarea></div><div class="fg"><label class="fl">Cor do marcador</label><select class="fs" id="eclr"><option value="blue">Azul (padrão)</option><option value="green">Verde (melhora)</option><option value="yellow">Amarelo (atenção)</option><option value="orange">Laranja (alerta)</option><option value="red">Vermelho (crítico)</option><option value="gray">Cinza (estável)</option></select></div><button class="bp2" onclick="gEv()">Gerar JSON para copiar</button><pre class="cb2 hdn" id="eout"></pre></div>`;}

function rAddImg(){return`<div class="pn2"><div class="ptg">➕ Adicionar Exame de Imagem</div><div class="hb3"><b>💡 Como funciona:</b> A Profª Natália quem faz, aluno não mexe aqui..</div><div class="fg"><label class="fl">Data do exame</label><input type="date" class="fi" id="id"></div><div class="fg"><label class="fl">Tipo de exame</label><input type="text" class="fi" id="it" placeholder="Ex: Tomografia de Crânio, Ressonância..."></div><div class="fg"><label class="fl">Descrição dos achados</label><textarea class="ft" id="ix" placeholder="Descreva os achados do exame..."></textarea></div><div class="fg"><label class="fl">Conclusão</label><textarea class="ft" id="ic" placeholder="Descreva a conclusão do laudo..."></textarea></div><button class="bp2" onclick="gImg()">Gerar JSON para copiar</button><pre class="cb2 hdn" id="iout"></pre></div>`;}

function rAddLab(){return`<div class="pn2"><div class="ptg">➕ Adicionar Exame Laboratorial</div><div class="hb3"><b>💡 Como funciona:</b> A Profª Natália quem faz, aluno não mexe aqui..</div><div class="fg"><label class="fl">Data do exame</label><input type="date" class="fi" id="ld"></div><div class="fg"><label class="fl">Nome do exame / painel</label><input type="text" class="fi" id="lt" placeholder="Ex: Hemograma, Gasometria, Bioquímica..."></div><div class="fg"><label class="fl">Itens (um por linha, formato: Nome | Valor | Ref | Unidade | true/false para alterado)</label><textarea class="ft" id="li" placeholder="Hemoglobina | 14,2 | 12,0-16,0 | g/dL | false&#10;Leucócitos | 12.800 | 4.000-11.000 | /mm³ | true"></textarea></div><button class="bp2" onclick="gLab()">Gerar JSON para copiar</button><pre class="cb2 hdn" id="lout"></pre></div>`;}

function gEv(){const d=document.getElementById('ed').value,c=document.getElementById('ec').value,t=document.getElementById('et').value,x=document.getElementById('ex').value,cl=document.getElementById('eclr').value;if(!d||!t||!x){alert('Preencha data, título e descrição.');return;}const df=d.split('-').reverse().join('/'),cc={blue:'blue',green:'green',yellow:'yellow',orange:'orange',red:'red',gray:'gray'}[cl];const o={data:df,titulo:t,cor:cc,texto:x};document.getElementById('eout').classList.remove('hdn');document.getElementById('eout').textContent=`// Cole em "evolucoes.${c}":\n`+JSON.stringify(o,null,2)+',';}

function gImg(){const d=document.getElementById('id').value,t=document.getElementById('it').value,x=document.getElementById('ix').value,cc=document.getElementById('ic').value;if(!d||!t||!x){alert('Preencha todos os campos.');return;}const df=d.split('-').reverse().join('/');const o={data:df,tipo:t,descricao:x,conclusao:cc};document.getElementById('iout').classList.remove('hdn');document.getElementById('iout').textContent=`// Cole em "exames_imagem":\n`+JSON.stringify(o,null,2)+',';}

function gLab(){const d=document.getElementById('ld').value,t=document.getElementById('lt').value,li=document.getElementById('li').value;if(!d||!t||!li){alert('Preencha todos os campos.');return;}const df=d.split('-').reverse().join('/'),its=li.split('\n').map(l=>{const p=l.split('|').map(s=>s.trim());return p.length>=4?{parametro:p[0],valor:p[1],referencia:p[2],unidade:p[3]||'',alterado:(p[4]||'').toLowerCase()==='true'}:null;}).filter(Boolean);const o={data:df,exame:t,itens:its};document.getElementById('lout').classList.remove('hdn');document.getElementById('lout').textContent=`// Cole em "exames_laboratoriais":\n`+JSON.stringify(o,null,2)+',';}

function sh(id){const tabs=['resumo','dados','historia','antecedentes','evento','evolucao','fisio','enfermagem','imagem','laboratorio','problemas','add-ev','add-img','add-lab'];tabs.forEach(t=>{const el=document.getElementById('t-'+t);if(el)el.classList.add('hdn');const b=document.getElementById('b-'+t);if(b)b.classList.remove('a');});const tr=document.getElementById('t-'+id);if(tr)tr.classList.remove('hdn');const bt=document.getElementById('b-'+id);if(bt)bt.classList.add('a');}

rAll();
</script>
